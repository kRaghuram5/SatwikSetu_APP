name: satwiksetu
description: "SatwikSetu - AI-Powered Agricultural Platform for Indian Farmers"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP & API
  dio: ^5.4.0
  retrofit: ^4.1.0

  # State Management
  provider: ^6.1.2
  shared_preferences: ^2.2.3

  # Image Picker
  image_picker: ^1.0.7

  # Navigation
  go_router: ^13.2.0

  # UI & Icons
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  lottie: ^3.1.0
  fl_chart: ^0.67.0
  cached_network_image: ^3.3.1

  # Utilities
  intl: ^0.19.0
  flutter_secure_storage: ^9.0.0
  permission_handler: ^11.3.0
  path_provider: ^2.1.3
  uuid: ^4.4.0
  file_picker: ^8.0.0+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  retrofit_generator: ^8.1.0
  build_runner: ^2.4.9
  json_annotation: ^4.9.0
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
